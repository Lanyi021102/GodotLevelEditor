name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/wiki/**'
      - 'mkdocs.yml'
      - 'requirements-wiki.txt'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/wiki/**'
      - 'mkdocs.yml'
      - 'requirements-wiki.txt'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-wiki.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-wiki.txt
      - name: Build Wiki
        run: python -m mkdocs build --strict
      - name: Check current Wiki links and search
        run: python tools/wiki/check.py --site site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Wiki
        id: deployment
        uses: actions/deploy-pages@v4
